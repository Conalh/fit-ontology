name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with ruff
        run: ruff check src scripts tests

      - name: Type-check with mypy
        # Config lives in pyproject.toml [tool.mypy]. The CI step is
        # the source of truth for "did types regress". The matrix
        # override keeps third-party stubs aligned with the Python
        # version installed in this job.
        run: mypy --python-version "${{ matrix.python-version }}"

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=src/fit_ontology \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Python dependency audit
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install pip-audit
          pip-audit .

      - name: Verify release contract
        if: matrix.python-version == '3.13'
        run: python scripts/release_check.py

      # Upload coverage.xml as a build artifact so it can be inspected
      # from a failed PR run or piped into an external service later
      # (codecov / coveralls) without re-running the suite.
      - name: Upload coverage artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # ─── Frontend build + typecheck ────────────────────────────────────
  #
  # Separate job from pytest so the two run in parallel on different
  # runners — faster end-to-end on PR builds, and a Python failure
  # doesn't mask a frontend regression (or vice versa). Node 24 matches
  # the package engine and Docker builder used for the release artifact.
  #
  # Two gates run here:
  #   - tsc --noEmit catches type-only regressions that the Python
  #     test suite can't see (E5 in the engine v2 arc landed a couple
  #     of TS issues that only showed up in `npx tsc` locally; this
  #     step would have caught them at PR time).
  #   - next build is the production-bundle check. Catches HTML/CSS
  #     emit issues, unused-import errors that escape tsc, and the
  #     output:export step that turns dynamic routes into static
  #     files. Doesn't deploy the artifact — it's a "does this build"
  #     gate, not a "publish web/out/" job.
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # ``npm ci`` (clean install from lockfile) instead of ``npm
        # install`` so the CI build is exactly reproducible and a
        # malformed lockfile fails loud here, not in the next deploy.
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm run test:run

      - name: Production build (next build, output:export)
        run: npm run build

      - name: Frontend dependency audit
        run: npm run audit:ci
