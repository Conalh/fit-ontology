name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with ruff
        run: ruff check src scripts tests

      - name: Type-check with mypy
        # Config lives in pyproject.toml [tool.mypy]. The CI step is
        # the source of truth for "did types regress" — green here
        # means `mypy src/fit_ontology` is also green locally.
        run: mypy

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=src/fit_ontology \
            --cov-report=term-missing \
            --cov-report=xml

      # Upload coverage.xml as a build artifact so it can be inspected
      # from a failed PR run or piped into an external service later
      # (codecov / coveralls) without re-running the suite.
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # ─── Frontend build + typecheck ────────────────────────────────────
  #
  # Separate job from pytest so the two run in parallel on different
  # runners — faster end-to-end on PR builds, and a Python failure
  # doesn't mask a frontend regression (or vice versa). Node 20 LTS
  # matches @types/node ^20 in web/package.json; Next 16 supports
  # Node 18.18+ but 20 has the longer LTS runway.
  #
  # Two gates run here:
  #   - tsc --noEmit catches type-only regressions that the Python
  #     test suite can't see (E5 in the engine v2 arc landed a couple
  #     of TS issues that only showed up in `npx tsc` locally; this
  #     step would have caught them at PR time).
  #   - next build is the production-bundle check. Catches HTML/CSS
  #     emit issues, unused-import errors that escape tsc, and the
  #     output:export step that turns dynamic routes into static
  #     files. Doesn't deploy the artifact — it's a "does this build"
  #     gate, not a "publish web/out/" job.
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # ``npm ci`` (clean install from lockfile) instead of ``npm
        # install`` so the CI build is exactly reproducible and a
        # malformed lockfile fails loud here, not in the next deploy.
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Production build (next build, output:export)
        run: npm run build
