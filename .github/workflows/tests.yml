name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with ruff
        run: ruff check src scripts tests

      - name: Type-check with mypy
        # Config lives in pyproject.toml [tool.mypy]. The CI step is
        # the source of truth for "did types regress" — green here
        # means `mypy src/fit_ontology` is also green locally.
        run: mypy

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=src/fit_ontology \
            --cov-report=term-missing \
            --cov-report=xml

      # Upload coverage.xml as a build artifact so it can be inspected
      # from a failed PR run or piped into an external service later
      # (codecov / coveralls) without re-running the suite.
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
