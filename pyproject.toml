[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-ontology"
version = "0.5.1"
description = "Client intelligence layer for personal trainers — wearables, intake, and ACSM guidelines unified."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Conal" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.5.0",
    "python-dateutil>=2.8.2",
    "garminconnect>=0.2.20",
    "python-dotenv>=1.0.0",
    "anthropic>=0.39.0",
    "reportlab>=4.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    # Phase 2b-α auth: bcrypt for password hashing and itsdangerous for
    # signing the session cookie. Using bcrypt directly rather than
    # passlib — passlib 1.7.4 broke against bcrypt 5.x (missing
    # ``__about__``), and bcrypt's bare API (hashpw / checkpw) is
    # already the entire surface we need. itsdangerous keeps the
    # cookie code to a few lines rather than pulling in a full framework.
    "bcrypt>=4.0.0",
    "itsdangerous>=2.1.0",
]

[project.scripts]
fit-ontology-serve = "fit_ontology.serve:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    # Pillow is only used by docs/screenshots/capture.py to generate
    # placeholder PNGs; not a runtime dep. Pinned at >=10 because the
    # ImageDraw API got tighter type annotations in that line.
    "Pillow>=10.0",
]
# Optional extra for the backup_db.py script. Only installed when the
# deploy actually runs the backup job — keeps the default runtime
# image lean (boto3 + botocore is ~10MB on disk). Compatible with any
# S3-shaped endpoint: Tigris, Backblaze B2, Cloudflare R2, AWS S3.
backup = [
    "boto3>=1.34",
]
# Optional extra for Sentry error monitoring. Enabled per-deploy by
# setting FIT_ONTOLOGY_SENTRY_DSN; when unset, the SDK isn't imported
# and dev runs unaffected. The [fastapi] extra pulls in the FastAPI
# integration; the SDK detects the running framework anyway, but
# pinning the extra keeps the install reproducible.
monitoring = [
    "sentry-sdk[fastapi]>=2.0",
]

[project.urls]
Repository = "https://github.com/Conalh/fit-ontology"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fit_ontology*"]

# ─── Pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# tests/test_trainer_cli.py does ``import scripts.trainer`` so the
# project root needs to be on sys.path. Pinning it via pythonpath is
# cleaner than scattering a conftest.py with sys.path hacks.
pythonpath = ["."]

# ─── Coverage ────────────────────────────────────────────────────────
# Source = src/fit_ontology (the part we own); skip the routes/__init__
# (auto-generated re-exports) and any local-dev script paths. The xml
# report is what GitHub Actions uploads as a build artifact.
[tool.coverage.run]
source = ["src/fit_ontology"]
branch = true
omit = [
    "*/__init__.py",
    "*/serve.py",            # uvicorn entry, exercised by integration
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 1
show_missing = true

# ─── Mypy ────────────────────────────────────────────────────────────
# Permissive on third-party imports without type stubs (anthropic,
# duckdb, garminconnect, reportlab, etc.) while keeping a real check
# on the project's own code. check_untyped_defs catches the obvious
# class of "you forgot to annotate this internal helper" without
# forcing every type to be explicit.
[tool.mypy]
python_version = "3.11"
files = ["src/fit_ontology"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
