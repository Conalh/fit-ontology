[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-ontology"
version = "0.5.1"
description = "Client intelligence layer for personal trainers — wearables, intake, and ACSM guidelines unified."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Conal" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.5.0",
    "python-dateutil>=2.8.2",
    "garminconnect>=0.2.20",
    "python-dotenv>=1.0.0",
    "anthropic>=0.39.0",
    "reportlab>=4.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    # Phase 2b-α auth: bcrypt for password hashing and itsdangerous for
    # signing the session cookie. Using bcrypt directly rather than
    # passlib — passlib 1.7.4 broke against bcrypt 5.x (missing
    # ``__about__``), and bcrypt's bare API (hashpw / checkpw) is
    # already the entire surface we need. itsdangerous keeps the
    # cookie code to a few lines rather than pulling in a full framework.
    "bcrypt>=4.0.0",
    "itsdangerous>=2.1.0",
]

[project.scripts]
fit-ontology-serve = "fit_ontology.serve:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/Conalh/fit-ontology"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fit_ontology*"]
